<tr>
  <td class="section-space" style="padding:0 40px 28px;">
    <div style="margin-bottom:14px;">
      <div class="section-title" style="font-size:20px;line-height:25px;font-weight:800;color:#101D4F;">Moving Service</div>
      <div class="section-kicker" style="margin-top:3px;font-size:12px;line-height:16px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.8px;">Moving Details</div>
    </div>

    <!-- Soft Light Outer Container with Crisp High-Contrast Borders -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
      style="width:100%;background:#F1F6FA;border:1.5px solid #BAC9D6;border-radius:14px;overflow:hidden;">
      <tr>
        <td style="padding:12px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <!-- Truck Size Card -->
              <td width="33.33%" style="padding:4px;vertical-align:top;" class="mobile-stack">
                <div style="background:#FFFFFF;border:1.5px solid #BAC9D6;border-radius:10px;padding:14px 16px;box-sizing:border-box;min-height:115px;">
                  <div class="info-label" style="color:#475569;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;">
                    <span style="display:inline-block;padding:2px 6px;background:#E0F2FE;color:#0284C7;border-radius:4px;font-size:11px;margin-right:4px;">🚚</span>Truck Size
                  </div>
                  <div class="info-value" style="font-size:14.5px;line-height:20px;font-weight:800;color:#101D4F;margin-top:6px;">{{TRUCK_SIZE}}</div>
                  <div style="margin-top:8px;">{{TRUCK_DIMENSIONS_LINK}}</div>
                </div>
              </td>

              <!-- Movers Card -->
              <td width="33.33%" style="padding:4px;vertical-align:top;" class="mobile-stack">
                <div style="background:#FFFFFF;border:1.5px solid #BAC9D6;border-radius:10px;padding:14px 16px;box-sizing:border-box;min-height:115px;">
                  <div class="info-label" style="color:#475569;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;">
                    <span style="display:inline-block;padding:2px 6px;background:#EDE9FE;color:#6D28D9;border-radius:4px;font-size:11px;margin-right:4px;">👥</span>Movers
                  </div>
                  <div class="info-value" style="font-size:15px;line-height:21px;font-weight:900;color:#101D4F;margin-top:6px;">{{MOVERS_COUNT}}</div>
                  <div style="margin-top:6px;font-size:11.5px;color:#64748B;font-weight:600;">Movers assigned</div>
                </div>
              </td>

              <!-- Property Size Card -->
              <td width="33.33%" style="padding:4px;vertical-align:top;" class="mobile-stack">
                <div style="background:#FFFFFF;border:1.5px solid #BAC9D6;border-radius:10px;padding:14px 16px;box-sizing:border-box;min-height:115px;">
                  <div class="info-label" style="color:#475569;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;">
                    <span style="display:inline-block;padding:2px 6px;background:#FEF3C7;color:#D97706;border-radius:4px;font-size:11px;margin-right:4px;">🏠</span>Size of Property
                  </div>
                  <div class="info-value" style="font-size:15px;line-height:21px;font-weight:900;color:#101D4F;margin-top:6px;">{{PROPERTY_SIZE}}</div>
                  <div style="margin-top:6px;font-size:11.5px;color:#64748B;font-weight:600;">Estimated scope</div>
                </div>
              </td>
            </tr>

            <!-- List of Items Card -->
            <tr>
              <td colspan="3" style="padding:4px;padding-top:8px;">
                <div style="background:#FFFFFF;border:1.5px solid #BAC9D6;border-radius:10px;padding:14px 16px;">
                  <div class="info-label" style="color:#475569;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;">
                    <span style="display:inline-block;padding:2px 6px;background:#ECFDF5;color:#059669;border-radius:4px;font-size:11px;margin-right:4px;">📦</span>List of Items
                  </div>
                  <div class="info-value" style="font-size:13.5px;line-height:20px;font-weight:600;color:#334155;margin-top:6px;">{{ITEM_LIST}}</div>
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
