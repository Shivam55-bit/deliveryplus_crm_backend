<tr>
  <td class="section-space" style="padding:0 40px 28px;">
    <div style="margin-bottom:14px;">
      <div class="section-title" style="font-size:20px;line-height:25px;font-weight:800;color:#101D4F;">Cost Breakdown</div>
      <div class="section-kicker" style="margin-top:3px;font-size:12px;line-height:16px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.8px;">Pricing Summary</div>
    </div>

    <!-- Fixed Total Card -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="total-card"
      style="width:100%;background:linear-gradient(135deg,#0D1B4C 0%,#1B3574 100%);border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(13,27,76,.2);">
      <tr>
        <td class="total-card-cell" style="padding:24px 28px;">
          <div class="total-label" style="font-size:12px;font-weight:800;color:#00B9E8;text-transform:uppercase;letter-spacing:1px;">Fixed Price Quote</div>
          <div class="total-description" style="font-size:13px;color:#BFD6EE;margin-top:4px;">All-inclusive fixed price for the specified scope of relocation</div>
          <div class="total-amount" style="font-size:38px;font-weight:900;color:#ffffff;line-height:44px;margin-top:8px;">{{FIXED_PRICE_AMOUNT}}</div>
        </td>
      </tr>
    </table>

    <!-- Deposit Required Notice -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
      style="width:100%;margin-top:16px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;overflow:hidden;">
      <tr>
        <td class="deposit-copy-cell" style="padding:16px 20px;vertical-align:middle;">
          <div style="font-size:13px;font-weight:700;color:#166534;">Booking Deposit Required to Confirm</div>
          <div style="font-size:12px;color:#15803D;margin-top:2px;">To confirm your booking, the deposit below is required. Deducted from your final bill.</div>
        </td>
        <td class="deposit-amount-cell" align="right" style="padding:16px 20px;text-align:right;vertical-align:middle;">
          <div style="font-size:24px;font-weight:900;color:#166534;">{{DEPOSIT_AMOUNT}}</div>
        </td>
      </tr>
    </table>
  </td>
</tr>
